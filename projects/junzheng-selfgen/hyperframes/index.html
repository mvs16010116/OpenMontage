<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>military-title-card :: 关键中间节点的公开协作</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    
    <style>
      @font-face{font-family:"Microsoft YaHei";src:local('Microsoft YaHei');font-display:swap}
      @font-face{font-family:"PingFang SC";src:local('PingFang SC');font-display:swap}
      body{margin:0;background:#070b12;color:#fff;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;overflow:hidden}
      #root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#070b12}
      .clip{position:absolute;inset:0;overflow:hidden}
      bar{display:block}
      
    #headline{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:96px;font-weight:700;letter-spacing:14px;color:#fff3d6}
    .w{display:inline-block}
    #kwbar{position:absolute;left:50%;top:64%;width:520px;height:10px;margin-left:-260px;background:#fbbf24;transform-origin:left;display:block}
    #kwtag{position:absolute;left:0;right:0;top:70%;text-align:center;font-size:42px;color:#fbbf24;letter-spacing:8px;opacity:0}
    #numwrap{position:absolute;left:0;right:0;top:76%;text-align:center;opacity:0}
    #numval{display:inline-block;font-size:120px;font-weight:700;color:#fff3d6}
    #numlabel{display:inline-block;font-size:36px;color:#fbbf24;margin-left:18px;letter-spacing:3px}
    #lower-third{position:absolute;left:60px;bottom:56px;font-size:28px;color:#fff3d6;opacity:.85;letter-spacing:3px;opacity:0}
  
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="14.9">
      <section id="scene" class="clip" data-start="0" data-duration="14.9" data-track-index="1">
        
    <div id="headline"><span class="w" id="w-0">关</span><span class="w" id="w-1">键</span><span class="w" id="w-2">中</span><span class="w" id="w-3">间</span><span class="w" id="w-4">节</span><span class="w" id="w-5">点</span><span class="w" id="w-6">的</span><span class="w" id="w-7">公</span><span class="w" id="w-8">开</span><span class="w" id="w-9">协</span><span class="w" id="w-10">作</span></div>
    <div id="kwbar"></div><div id="kwtag">成本最低</div>
    <div id="numwrap"><span id="numval" data-t="2">0</span><span id="numlabel">战线</span></div>
    
  
      </section>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      
    const tl = gsap.timeline({ paused: true });
    gsap.set(["#w-0","#w-1","#w-2","#w-3","#w-4","#w-5","#w-6","#w-7","#w-8","#w-9","#w-10"], { y: 60, opacity: 0 });
    tl.to(["#w-0","#w-1","#w-2","#w-3","#w-4","#w-5","#w-6","#w-7","#w-8","#w-9","#w-10"], {
      y: 0, opacity: 1, duration: 0.6, ease: "power3.out", stagger: 0.04,
    }, 0.3);
    
    tl.fromTo("#kwbar", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, 1.2);
    tl.to("#kwtag", { opacity: 1, duration: 0.5 }, 1.6);
    
    tl.to("#numwrap", { opacity: 1, duration: 0.3 }, 2.0);
    {
      const el = document.getElementById("numval");
      const p = { v: 0 };
      tl.to(p, { v: 2, duration: 1.4, ease: "power2.out", onUpdate() { el.textContent = Math.round(p.v); } }, 2.1);
    }
    
    window.__timelines["main"] = tl;
  
    </script>
  </body>
</html>
