<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>military-data-viz :: scene_section_07_1</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face{font-family:"Microsoft YaHei";src:local('Microsoft YaHei');font-display:swap}
      @font-face{font-family:"PingFang SC";src:local('PingFang SC');font-display:swap}
      body{margin:0;background:#05070d;color:#fff;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;overflow:hidden}
      #root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#05070d}
      .clip{position:absolute;inset:0;overflow:hidden}
      #bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:transform}
      #shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(5,7,13,.18) 0%,rgba(5,7,13,.4) 40%,rgba(5,7,13,.82) 82%,rgba(5,7,13,.94) 100%)}
      bar{display:block}
      #title{position:absolute;left:60px;right:60px;top:9%;text-align:center;font-size:64px;font-weight:700;letter-spacing:5px;color:#fff3d6;line-height:1.4}
      #rail{position:absolute;left:50%;top:20%;bottom:26%;border-left:4px dashed rgba(255,255,255,.25)}
      #kpi{position:absolute;left:0;right:0;bottom:7%;text-align:center;font-size:40px;color:#fbbf24;letter-spacing:3px;font-weight:700}
      .chiprow{position:absolute;left:0;right:0;display:flex;justify-content:center;opacity:0}
      .chip{display:inline-flex;align-items:center;background:#fbbf24;color:#070b12;border-radius:14px;padding:18px 30px;font-size:42px;font-weight:700;letter-spacing:1px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
      .cd{margin-right:16px}
      .cv{font-weight:700}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="6.500">
      <section id="scene" class="clip" data-start="0" data-duration="6.500" data-track-index="1">
        <img id="bgimg" src="assets/images/scene_section_07_1.jpg" alt="" />
        <div id="shade"></div>
        <div id="title">历史先例：复仇式清算</div>
        <div id="rail"></div>
        
      <div class="chiprow" id="trow-0" style="top:calc(50% - 150px)">
        <span class="chip" id="chip-0"><span class="cd">上世纪末</span><span class="cv">复仇优先</span></span>
      </div>
    
      <div class="chiprow" id="trow-1" style="top:calc(50% + 45px)">
        <span class="chip" id="chip-1"><span class="cd">如今</span><span class="cv">核心承诺</span></span>
      </div>
        <div id="kpi">似曾相识</div>
      </section>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      gsap.set("#bgimg",{scale:1.0});
      tl.to("#bgimg",{scale:1.08,duration:6.500,ease:"none"},0);
      tl.from("#title", { y: -40, opacity: 0, duration: 0.6, ease: "power3.out" }, 0.2);
      tl.fromTo("#trow-0",{opacity:0,y:24,scale:0.9},{opacity:1,y:0,scale:1,duration:0.45,ease:"back.out(1.6)"},0.9);
      tl.fromTo("#trow-1",{opacity:0,y:24,scale:0.9},{opacity:1,y:0,scale:1,duration:0.45,ease:"back.out(1.6)"},1.4500000000000002);
      tl.from("#kpi", { opacity: 0, y: 20, duration: 0.5 }, 2);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
