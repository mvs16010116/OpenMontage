name: narration-synth
version: "1.0"
description: >
  Narration-led explained promo pipeline for military-political commentary (军政), same
  spine as narration-montage but with SELF-GENERATED visuals instead of stock footage.
  STORYBOARD MODEL: a story is many small stories — the script is segmented into
  sections, each section is split into SEMANTIC SENTENCES, and each sentence is ONE
  SHOT (scene). Each shot is assembled by overlaying MATERIALS in the same window
  (background skill + midground + foreground data/text cards), each material routed
  to a `military-*` HyperFrames skill (warship / missile / map-deduction / data-viz
  / title-card / seal) via its own generation spec. The asset stage runs each
  material's `build_*.mjs` to write a HyperFrames composition, verifies it via
  `hyperframes lint` + `hyperframes validate`, then renders it to a per-material
  TRANSPARENT MP4 via `npx hyperframes render`. TTS narration and a music bed are
  generated alongside. The edit stage lays one timeline SLOT per shot with its
  materials in layer order and locks short-line ASS subtitles
  (ass-subtitle-generator) + a back-to-back narration mix; the compose stage
  regenerates subtitles from real narration offsets, OVERLAYS each slot's materials
  into one shot image, concatenates the shots, rebuilds the narration mix
  contiguously (silence only at opener/chapter cards), burns the subtitles, and
  muxes narration + music via ffmpeg. A title-card scene (military-title-card)
  bookends the piece for chapter/emphasis transitions.
category: generated
stability: beta

reference_input:
  supported: false

orchestration:
  mode: executive-producer
  skill: pipelines/narration-synth/executive-producer
  budget_default_usd: 0.10
  max_revisions_per_stage: 3
  max_send_backs: 2
  max_wall_time_minutes: 60

extensions:
  custom_scripts: true
  custom_playbooks: true
  custom_skills: true
  custom_tools: false

required_skills:
  - pipelines/narration-synth/executive-producer
  - pipelines/narration-synth/idea-director
  - pipelines/narration-synth/script-director
  - pipelines/narration-synth/scene-director
  - pipelines/narration-synth/asset-director
  - pipelines/narration-synth/edit-director
  - pipelines/narration-synth/compose-director
  - meta/reviewer
  - meta/checkpoint-protocol

compatible_playbooks:
  custom_allowed: true

stages:
  - name: idea
    skill: pipelines/narration-synth/idea-director
    produces:
      - brief
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Hook is a single clear question or thesis in the first segment
      - Script segments are split at meaningful boundaries (not mid-sentence)
      - Target duration and tone are concrete
      - Narration voice/register is chosen and recorded
      - Music plan is present (MANDATORY — silent only if user explicitly opted out)
    success_criteria:
      - Schema-valid brief artifact
      - hook present and non-empty
      - metadata.narration_plan present (provider + voice)
      - metadata.music_plan present (source may be `none` ONLY with explicit opt-out note)

  - name: script
    skill: pipelines/narration-synth/script-director
    required_artifacts_in:
      - brief
    produces:
      - script
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Sections are ordered with a clear hook → body → closing arc
      - Per-section text is sized for the target duration (Chinese ~4-5 chars/sec)
      - Every section has a start/end and a delivery cue when needed
      - No section is so long it will exceed 90s of narration
    success_criteria:
      - Schema-valid script artifact
      - sections[].text non-empty for every section
      - total_duration_seconds matches the estimated narration length
      - every section has id, text, start_seconds, end_seconds

  - name: scene_plan
    skill: pipelines/narration-synth/scene-director
    required_artifacts_in:
      - script
    produces:
      - scene_plan
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - One SHOT per semantic sentence; each section splits into sentence-shots at meaning boundaries, time-aligned proportionally
      - Every shot carries `materials[]` (background/midground/foreground), each material naming ONE military-* skill plus its exact CLI args
      - Material specs are deterministic (no random seeds; fixed palettes/accents consistent within a shot)
      - Scene descriptions use concrete noun-and-adjective visual language
      - Adjacent shots vary their background/full-frame skill (foreground overlays exempt)
      - Sentence-shot windows sum to their section window (no unaccounted time)
    success_criteria:
      - Schema-valid scene_plan artifact
      - Every script section has >=1 shot (semantic-sentence split), windows sum to section
      - Sum of (end_seconds - start_seconds) within 10% of script.total_duration_seconds
      - Every shot has materials[] with skills in the allowed set and concrete args + layer order

  - name: assets
    skill: pipelines/narration-synth/asset-director
    required_artifacts_in:
      - scene_plan
      - script
    produces:
      - asset_manifest
    required_tools:
      - tts_selector
    optional_tools:
      - hyperframes_compose
      - audio_mixer
    tools_available:
      - tts_selector
      - hyperframes_compose
      - audio_mixer
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - One self-generated TRANSPARENT animation MP4 per MATERIAL, produced from its material spec
      - Every material composition passed `hyperframes lint` + `hyperframes validate` (0 errors) before render
      - HyperFrames render output is 1920x1080 WITH ALPHA and its duration matches the shot window
      - No two materials in the same shot share identical output (each material renders its own composition)
      - Every animation asset has provenance (skill name, build script, CLI args, seed, material_id, layer)
      - Narration audio generated with the approved voice + REAL probed duration
      - Music plan executed EXACTLY as recorded in the brief
    success_criteria:
      - Schema-valid asset_manifest artifact
      - One `animation` asset PER MATERIAL with duration_seconds ≈ shot window, has_alpha true
      - narration assets present per section (or explicit opt-out recorded)
      - Effectively unmixed narration + music assets present (or explicit opt-out)
      - Every asset's file path resolves on disk

  - name: edit
    skill: pipelines/narration-synth/edit-director
    required_artifacts_in:
      - scene_plan
      - asset_manifest
    produces:
      - edit_decisions
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - One timeline SLOT per shot; a section's sentence-shots are consecutive slots whose windows sum to the section window
      - Every slot lists ALL materials in layer order (background → midground → foreground), all spanning the SAME window (overlay, not concat)
      - Subtitle style is locked (short-line ASS via ass-subtitle-generator; bookends excluded)
      - Audio layout — narration back-to-back (silence only at opener/chapter cards), matches the brief
      - render_runtime stays "ffmpeg" (material overlay + concat + subtitle burn + mux)
    success_criteria:
      - Schema-valid edit_decisions artifact
      - render_runtime present and ffmpeg
      - subtitles.enabled is true and subtitles.style points to ass-subtitle-generator output
      - total duration matches script.total_duration_seconds within 10% (incl. bookends; sentence-shots sum per section)

  - name: compose
    skill: pipelines/narration-synth/compose-director
    required_artifacts_in:
      - edit_decisions
      - asset_manifest
      - brief
    produces:
      - render_report
      - final_review
    required_tools:
      - video_compose
    optional_tools:
      - audio_mixer
    tools_available:
      - video_compose
      - audio_mixer
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - Output duration matches planned within 1s
      - Resolution matches the 1920x1080 canvas
      - Subtitle lines are burned and readable (no \k karaoke markers); pixel check passes (burn-in is invisible to stream probes)
      - Each slot's materials overlayed in layer order (background visible under foreground; no material hides another)
      - Narration is muxed back-to-back (silence only at opener/chapter cards) and synchronized to section starts
      - Shot boundaries land at sentence transitions; no missing-shot blanks
      - Audio layout verified via volumedetect — narration present at windows, near-silent at bookends
      - Self-generated animations appear (not stock); no missing-material blanks
    success_criteria:
      - Schema-valid render_report artifact
      - Schema-valid final_review artifact (status pass/revise/fail)
      - Output file exists and passes ffprobe validation
      - final_review.checks.subtitle_check.subtitles_present = true (or pixel-check substitute noted)
      - final_review.checks.audio_spotcheck.narration_present = true
      - final_review.recommended_action present