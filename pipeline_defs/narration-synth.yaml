name: narration-synth
version: "1.0"
description: >
  Narration-led explained promo pipeline for military-political commentary (军政), same
  spine as narration-montage but with SELF-GENERATED visuals instead of stock footage.
  The script is segmented, each section maps to a scene, and each scene maps to a
  `generation_spec` that routes to one of the `military-*` HyperFrames skills
  (warship / missile / map-deduction / data-viz / title-card / seal). The asset
  stage runs the skill's `build_*.mjs` to write a HyperFrames composition, verifies
  it via `hyperframes lint` + `hyperframes validate`, then renders it to a per-scene
  MP4 via `npx hyperframes render`. TTS narration and a music bed are generated
  alongside. The edit stage lays one generated scene per section; the compose stage
  force-aligns subtitles to real narration audio (transcriber), concatenates the
  scene MP4s, burns static whole-line subtitles, and muxes narration + music via
  ffmpeg. A title-card scene (military-title-card) bookends the piece for
  chapter/emphasis transitions.
category: generated
stability: beta

reference_input:
  supported: false

orchestration:
  mode: executive-producer
  skill: pipelines/narration-synth/executive-producer
  budget_default_usd: 0.10
  max_revisions_per_stage: 3
  max_send_backs: 2
  max_wall_time_minutes: 60

extensions:
  custom_scripts: true
  custom_playbooks: true
  custom_skills: true
  custom_tools: false

required_skills:
  - pipelines/narration-synth/executive-producer
  - pipelines/narration-synth/idea-director
  - pipelines/narration-synth/script-director
  - pipelines/narration-synth/scene-director
  - pipelines/narration-synth/asset-director
  - pipelines/narration-synth/edit-director
  - pipelines/narration-synth/compose-director
  - meta/reviewer
  - meta/checkpoint-protocol

compatible_playbooks:
  custom_allowed: true

stages:
  - name: idea
    skill: pipelines/narration-synth/idea-director
    produces:
      - brief
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Hook is a single clear question or thesis in the first segment
      - Script segments are split at meaningful boundaries (not mid-sentence)
      - Target duration and tone are concrete
      - Narration voice/register is chosen and recorded
      - Music plan is present (MANDATORY — silent only if user explicitly opted out)
    success_criteria:
      - Schema-valid brief artifact
      - hook present and non-empty
      - metadata.narration_plan present (provider + voice)
      - metadata.music_plan present (source may be `none` ONLY with explicit opt-out note)

  - name: script
    skill: pipelines/narration-synth/script-director
    required_artifacts_in:
      - brief
    produces:
      - script
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Sections are ordered with a clear hook → body → closing arc
      - Per-section text is sized for the target duration (Chinese ~4-5 chars/sec)
      - Every section has a start/end and a delivery cue when needed
      - No section is so long it will exceed 90s of narration
    success_criteria:
      - Schema-valid script artifact
      - sections[].text non-empty for every section
      - total_duration_seconds matches the estimated narration length
      - every section has id, text, start_seconds, end_seconds

  - name: scene_plan
    skill: pipelines/narration-synth/scene-director
    required_artifacts_in:
      - script
    produces:
      - scene_plan
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - One scene per script section, time-aligned to the section window
      - Every scene carries a `generation_spec` naming ONE military-* skill plus its exact CLI args
      - generation_spec is deterministic (no random seeds; fixed palettes/accents)
      - Scene descriptions use concrete noun-and-adjective visual language
      - Scene type spread avoids two adjacent scenes using the same military-* skill
    success_criteria:
      - Schema-valid scene_plan artifact
      - One scene per script section (count matches sections count)
      - Sum of (end_seconds - start_seconds) within 10% of script.total_duration_seconds
      - Every scene has a generation_spec with skill in the allowed set and concrete args

  - name: assets
    skill: pipelines/narration-synth/asset-director
    required_artifacts_in:
      - scene_plan
      - script
    produces:
      - asset_manifest
    required_tools:
      - tts_selector
    optional_tools:
      - hyperframes_compose
      - audio_mixer
    tools_available:
      - tts_selector
      - hyperframes_compose
      - audio_mixer
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - One self-generated animation MP4 per scene, produced from its generation_spec
      - Every scene composition passed `hyperframes lint` + `hyperframes validate` (0 errors) before render
      - HyperFrames render output is 1920x1080 and its duration matches the scene window
      - No two scenes share the same output clip (each scene renders its own composition)
      - Every animation asset has provenance (skill name, build script, CLI args, seed)
      - Narration audio generated with the approved voice + REAL probed duration
      - Music plan executed EXACTLY as recorded in the brief
    success_criteria:
      - Schema-valid asset_manifest artifact
      - One `animation` asset per scene with duration_seconds >= scene window
      - narration assets present per section (or explicit opt-out recorded)
      - Effectively unmixed narration + music assets present (or explicit opt-out)
      - Every asset's file path resolves on disk

  - name: edit
    skill: pipelines/narration-synth/edit-director
    required_artifacts_in:
      - scene_plan
      - asset_manifest
    produces:
      - edit_decisions
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - One generated scene per section; scene clips are not re-cut into multiple shots
      - Subtitle style is locked (static whole-line, force-aligned timing)
      - Audio layout matches the narration plan from the brief
      - render_runtime stays "ffmpeg" (scene MP4s concat + subtitle burn + mux)
    success_criteria:
      - Schema-valid edit_decisions artifact
      - render_runtime present and ffmpeg
      - subtitles.enabled is true and subtitles.style is set
      - total duration matches script.total_duration_seconds within 10%

  - name: compose
    skill: pipelines/narration-synth/compose-director
    required_artifacts_in:
      - edit_decisions
      - asset_manifest
      - brief
    produces:
      - render_report
      - final_review
    required_tools:
      - video_compose
    optional_tools:
      - video_stitch
      - transcriber
      - subtitle_gen
    tools_available:
      - video_compose
      - video_stitch
      - transcriber
      - subtitle_gen
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - Output duration matches planned within 1s
      - Resolution matches the 1920x1080 canvas
      - Subtitle lines are burned and readable (no \k karaoke markers)
      - Narration is muxed and synchronized (force-aligned timestamps)
      - Scene cuts land at section boundaries (one generated scene per section)
      - Self-generated animations appear (not stock); no missing-scene blanks
    success_criteria:
      - Schema-valid render_report artifact
      - Schema-valid final_review artifact (status pass/revise/fail)
      - Output file exists and passes ffprobe validation
      - final_review.checks.subtitle_check.subtitles_present = true
      - final_review.checks.audio_spotcheck.narration_present = true
      - final_review.recommended_action present