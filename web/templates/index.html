<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>口播视频生成器</title>
<style>
  :root {
    --bg: #070b12;
    --panel: #0e1520;
    --fg: #f5f0e3;
    --muted: #9aa4b5;
    --accent: #fbbf24;
    --danger: #f87171;
    --ok: #34d399;
    --border: #232c3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    min-height: 100vh; display: flex; justify-content: center; padding: 40px 16px;
  }
  .wrap { width: 100%; max-width: 860px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: .5px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; margin-bottom: 16px;
  }
  .card h3 { margin: 0 0 12px; font-size: 15px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], input[type=password], input[type=number], select, textarea {
    width: 100%; background: #0a0f18; color: var(--fg); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 11px; font-size: 14px; font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { min-height: 120px; line-height: 1.7; resize: vertical; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  .btn {
    margin-top: 12px; background: var(--accent); color: #1a1a1a; border: none;
    border-radius: 8px; padding: 11px 22px; font-size: 15px; font-weight: 600;
    cursor: pointer;
  }
  .btn.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .progress { margin-top: 14px; display: none; }
  .progress.show { display: block; }
  .bar { height: 8px; background: #1a2230; border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; width: 0%; background: var(--accent); transition: width .4s ease; }
  .stage-text { font-size: 13px; color: var(--muted); margin-top: 8px; white-space: pre-line; }
  .stats { margin-top: 12px; font-size: 13px; color: var(--muted); }
  .stats-table { border-collapse: collapse; width: 100%; max-width: 420px; margin-top: 6px; }
  .stats-table th, .stats-table td { border-bottom: 1px solid rgba(255,255,255,.08); padding: 5px 10px; text-align: left; }
  .stats-table th { color: var(--muted); font-weight: 600; }
  .stats-table tr.total td { font-weight: 600; color: var(--text); }
  .tok { margin-top: 8px; font-family: ui-monospace, Consolas, monospace; }
  .err { color: var(--danger); font-size: 13px; margin-top: 10px; white-space: pre-wrap; }
  .ok { color: var(--ok); font-size: 13px; margin-top: 10px; }
  h2 { font-size: 16px; margin: 24px 0 12px; color: var(--fg); }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .item {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .item .sum { flex: 1 1 220px; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 11px; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .badge.done { background: rgba(52,211,153,.15); color: var(--ok); }
  .badge.running { background: rgba(251,191,36,.15); color: var(--accent); }
  .badge.queued { background: rgba(154,164,181,.15); color: var(--muted); }
  .badge.error { background: rgba(248,113,113,.15); color: var(--danger); }
  .badge.interrupted { background: rgba(154,164,181,.2); color: var(--muted); }
  .item .time { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .item .dl { color: var(--accent); text-decoration: none; font-size: 12px; white-space: nowrap; }
  .item .dl:hover { text-decoration: underline; }
  nav { display: flex; gap: 8px; margin: 16px 0; }
  nav button { background: transparent; color: var(--muted); border: 1px solid var(--border);
    padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  nav button.active { color: var(--accent); border-color: var(--accent); }
  #loginView { max-width: 360px; margin: 80px auto 0; }
  #loginView .card { padding: 28px; }
  .muted { color: var(--muted); font-size: 12px; }
  .checkline { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .checkline input { width: auto; }
</style>
</head>
<body>
<div class="wrap">

  <div id="loginView" style="display:none">
    <h1>口播视频生成器</h1>
    <div class="card">
      <label>用户名</label>
      <input id="loginUser" type="text" autocomplete="username" value="admin">
      <label>密码</label>
      <input id="loginPass" type="password" autocomplete="current-password">
      <button id="loginBtn" class="btn">登 录</button>
      <div class="err" id="loginErr"></div>
    </div>
  </div>

  <div id="app" style="display:none">
    <h1>口播视频生成器</h1>
    <div class="sub">飞书多维表格文案 → 自动生成视频 → 回填状态并上传成片</div>
    <nav>
      <button id="navTasks" class="active">任务</button>
      <button id="navSettings">配置</button>
      <button id="logoutBtn" class="secondary">退出登录</button>
    </nav>

    <!-- 任务视图 -->
    <section id="tasksView">
      <div class="card">
        <label>口播文案（或使用「扫描多维表格」从 Base 读取）</label>
        <textarea id="txt" placeholder="在此粘贴口播文案（一段话即可，自动分节）…"></textarea>
        <button id="go" class="btn">生成视频</button>
        <button id="scanBtn" class="btn secondary" style="margin-left:8px">扫描多维表格</button>
        <div class="ok" id="scanResult"></div>
        <div class="err" id="scanErr"></div>
        <div class="progress" id="progress">
          <div class="bar"><div id="barfill"></div></div>
          <div class="stage-text" id="stageText"></div>
        </div>
        <div class="stats" id="statsBox" style="display:none"></div>
        <div class="err" id="err"></div>
        <div class="done-link" id="doneLink" style="display:none">
          <video id="preview" controls style="width:100%;max-width:640px;max-height:360px;background:#000"></video>
          <p><a id="dlHref" href="#" target="_blank">下载成片 final.mp4</a></p>
        </div>
      </div>
      <h2>历史生成</h2>
      <div class="list" id="list"></div>
    </section>

    <!-- 配置视图 -->
    <section id="settingsView" style="display:none">
      <div class="card">
        <h3>飞书多维表格</h3>
        <label>Base 链接或 base_token（自动解析）</label>
        <input id="cfg-base" type="text" placeholder="https://xxx.feishu.cn/base/... 或 base token">
        <label>数据表 ID / 名称</label>
        <input id="cfg-table" type="text" placeholder="table_id 或表名">
        <div class="row">
          <div>
            <label>文案字段</label>
            <input id="cfg-f-content" type="text" placeholder="如「口播文案」">
          </div>
          <div>
            <label>日期字段（兼排序字段）</label>
            <input id="cfg-f-date" type="text" placeholder="如「日期」">
          </div>
        </div>
        <div class="row">
          <div>
            <label>回填状态字段</label>
            <input id="cfg-f-status" type="text" placeholder="如「状态」">
          </div>
          <div>
            <label>视频附件字段</label>
            <input id="cfg-f-attach" type="text" placeholder="如「成片视频」">
          </div>
        </div>
        <div class="row">
          <div>
            <label>排序方向</label>
            <select id="cfg-date-sort">
              <option value="asc">升序（先处理早的）</option>
              <option value="desc">降序（先处理晚的）</option>
            </select>
          </div>
          <div>
            <label>状态词（成功 / 失败 / 处理中 / 视为待处理）</label>
            <input id="cfg-status-words" type="text" placeholder="成功,失败,处理中,待处理">
          </div>
        </div>
      </div>

      <div class="card">
        <h3>LLM 配置（OpenAI 兼容：文案分节 + 图片关键词）</h3>
        <label>Base URL</label>
        <input id="cfg-llm-url" type="text" placeholder="https://api.openai.com/v1">
        <div class="row">
          <div>
            <label>API Key</label>
            <input id="cfg-llm-key" type="password" placeholder="sk-...">
          </div>
          <div>
            <label>Model</label>
            <input id="cfg-llm-model" type="text" placeholder="gpt-4o-mini / deepseek-chat">
          </div>
        </div>
        <div class="row">
          <div>
            <label>temperature</label>
            <input id="cfg-llm-temp" type="number" step="0.1" min="0" max="2">
          </div>
          <div>
            <label>max_tokens</label>
            <input id="cfg-llm-max" type="number" min="1">
          </div>
        </div>
      </div>

      <div class="card">
        <h3>自动轮询</h3>
        <div class="checkline">
          <input id="cfg-poll-enable" type="checkbox">
          <label style="margin:0">启用自动扫描多维表格</label>
        </div>
        <div class="row">
          <div>
            <label>扫描间隔（秒）</label>
            <input id="cfg-poll-interval" type="number" min="10">
          </div>
          <div>
            <label>每批最多记录数</label>
            <input id="cfg-poll-max" type="number" min="1">
          </div>
        </div>
      </div>

      <button id="saveSettings" class="btn">保存配置</button>
      <div class="ok" id="settingsOk"></div>
      <div class="err" id="settingsErr"></div>

      <div class="card" style="margin-top:16px">
        <h3>修改登录密码</h3>
        <div class="row">
          <div><label>原密码</label><input id="pw-old" type="password"></div>
          <div><label>新密码</label><input id="pw-new" type="password"></div>
        </div>
        <button id="pwBtn" class="btn secondary">修改密码</button>
        <div class="ok" id="pwOk"></div>
        <div class="err" id="pwErr"></div>
      </div>
    </section>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const STAGE_LABEL = {
  llm_parse: "正在解析分节…",
  generating_tts: "正在生成配音…",
  fetching_images: "正在检索配图…",
  rendering_scenes: "正在渲染画面…",
  subtitles: "正在生成字幕…",
  assembling: "正在合成成片…",
  done: "生成完成",
  error: "生成失败",
  queued: "排队中…",
  running: "正在生成…",
};

// ---------- 登录 / 会话 ----------
async function boot() {
  try {
    const r = await fetch("/api/me");
    if (r.ok) { showApp(); return; }
  } catch (_) {}
  showLogin();
}

function showLogin() {
  $("loginView").style.display = "block";
  $("app").style.display = "none";
}
function showApp() {
  $("loginView").style.display = "none";
  $("app").style.display = "block";
  refreshList();
}

$("loginBtn").addEventListener("click", async () => {
  $("loginErr").textContent = "";
  const r = await fetch("/api/login", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: $("loginUser").value.trim(), password: $("loginPass").value }),
  });
  if (r.ok) { boot(); return; }
  const e = await r.json().catch(() => ({}));
  $("loginErr").textContent = e.detail || "登录失败";
});
$("logoutBtn").addEventListener("click", async () => {
  await fetch("/api/logout", { method: "POST" });
  showLogin();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && $("loginView").style.display !== "none") $("loginBtn").click();
});

// ---------- 视图切换 ----------
$("navTasks").addEventListener("click", () => switchView("tasks"));
$("navSettings").addEventListener("click", () => switchView("settings"));
function switchView(name) {
  $("navTasks").classList.toggle("active", name === "tasks");
  $("navSettings").classList.toggle("active", name === "settings");
  $("tasksView").style.display = name === "tasks" ? "block" : "none";
  $("settingsView").style.display = name === "settings" ? "block" : "none";
  if (name === "settings") loadSettings();
}

// ---------- 配置 ----------
async function loadSettings() {
  $("settingsErr").textContent = ""; $("settingsOk").textContent = "";
  const r = await fetch("/api/settings");
  if (!r.ok) return;
  const s = await r.json();
  $("cfg-base").value = s.lark.base_url_or_token || "";
  $("cfg-table").value = s.lark.table_id || "";
  $("cfg-f-content").value = s.fields.content_field || "";
  $("cfg-f-date").value = s.fields.date_field || "";
  $("cfg-f-status").value = s.fields.status_field || "";
  $("cfg-f-attach").value = s.fields.attachment_field || "";
  $("cfg-date-sort").value = s.fields.date_sort || "asc";
  $("cfg-status-words").value = [s.video.status_success, s.video.status_failed, s.video.status_processing, s.video.pending_if].join(",");
  $("cfg-llm-url").value = s.llm.base_url || "";
  $("cfg-llm-key").value = s.llm.api_key || "";
  $("cfg-llm-model").value = s.llm.model || "";
  $("cfg-llm-temp").value = s.llm.temperature ?? 0.2;
  $("cfg-llm-max").value = s.llm.max_tokens ?? 2000;
  $("cfg-poll-enable").checked = !!s.poll.enabled;
  $("cfg-poll-interval").value = s.poll.interval_seconds || 300;
  $("cfg-poll-max").value = s.poll.max_records_per_batch || 20;
}

$("saveSettings").addEventListener("click", async () => {
  $("settingsErr").textContent = ""; $("settingsOk").textContent = "";
  const words = $("cfg-status-words").value.split(/[,，]/).map(x => x.trim());
  const payload = {
    lark: { base_url_or_token: $("cfg-base").value.trim(), table_id: $("cfg-table").value.trim() },
    fields: {
      content_field: $("cfg-f-content").value.trim(),
      date_field: $("cfg-f-date").value.trim(),
      status_field: $("cfg-f-status").value.trim(),
      attachment_field: $("cfg-f-attach").value.trim(),
      date_sort: $("cfg-date-sort").value,
    },
    llm: {
      base_url: $("cfg-llm-url").value.trim(),
      api_key: $("cfg-llm-key").value.trim(),
      model: $("cfg-llm-model").value.trim(),
      temperature: parseFloat($("cfg-llm-temp").value) || 0.2,
      max_tokens: parseInt($("cfg-llm-max").value, 10) || 2000,
    },
    poll: {
      enabled: $("cfg-poll-enable").checked,
      interval_seconds: parseInt($("cfg-poll-interval").value, 10) || 300,
      max_records_per_batch: parseInt($("cfg-poll-max").value, 10) || 20,
    },
    video: {
      status_success: words[0] || "成功",
      status_failed: words[1] || "失败",
      status_processing: words[2] || "处理中",
      pending_if: words[3] || "待处理",
    },
  };
  const r = await fetch("/api/settings", {
    method: "PUT", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  if (r.ok) { $("settingsOk").textContent = "已保存"; loadSettings(); }
  else { const e = await r.json().catch(() => ({})); $("settingsErr").textContent = e.detail || "保存失败"; }
});

$("pwBtn").addEventListener("click", async () => {
  $("pwErr").textContent = ""; $("pwOk").textContent = "";
  const r = await fetch("/api/change-password", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ old_password: $("pw-old").value, new_password: $("pw-new").value }),
  });
  if (r.ok) { $("pwOk").textContent = "密码已修改"; $("pw-old").value = ""; $("pw-new").value = ""; }
  else { const e = await r.json().catch(() => ({})); $("pwErr").textContent = e.detail || "修改失败"; }
});

// ---------- 任务（文案直录，004-02 起扩展扫描） ----------
let busy = false;
$("go").addEventListener("click", async () => {
  const text = $("txt").value.trim();
  if (!text || busy) return;
  busy = true; $("go").disabled = true;
  $("err").textContent = ""; $("doneLink").style.display = "none";
  $("statsBox").style.display = "none";
  showProgress("queued", 2);
  const res = await fetch("/api/generate", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ narration_text: text }),
  });
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    fail(e.detail || "提交失败"); return;
  }
  const { task_id } = await res.json();
  listen(task_id);
  refreshList();
});

function showProgress(stage, pct, extra) {
  $("progress").classList.add("show");
  $("barfill").style.width = pct + "%";
  $("stageText").textContent = extra || (STAGE_LABEL[stage] || stage || "…");
}

$("scanBtn").addEventListener("click", async () => {
  $("scanErr").textContent = ""; $("scanResult").textContent = "扫描中…";
  const r = await fetch("/api/base/scan", { method: "POST" });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) { $("scanErr").textContent = body.detail || "扫描失败"; $("scanResult").textContent = ""; return; }
  $("scanResult").textContent = `扫描到 ${body.pending} 条待处理，新建 ${body.created.length} 条任务，跳过 ${body.skipped.length} 条。`;
  refreshList();
});

function fail(msg) {
  $("err").textContent = msg;
  $("progress").classList.remove("show");
  $("statsBox").style.display = "none";
  busy = false; $("go").disabled = false;
}

function listen(taskId) {
  const es = new EventSource(`/api/tasks/${taskId}/events`);
  const order = ["queued","llm_parse","generating_tts","fetching_images",
                 "rendering_scenes","subtitles","assembling","done","error"];
  const idx = {}; order.forEach((s, i) => idx[s] = i);
  es.onmessage = (e) => {
    let ev; try { ev = JSON.parse(e.data); } catch { return; }
    if (ev.stage === "__close__") { es.close(); refreshList(); busy = false; $("go").disabled = false; return; }
    if (ev.stage === "done") {
      showProgress("done", 100, "生成完成");
      $("dlHref").href = `/api/tasks/${taskId}/video`;
      $("preview").src = `/api/tasks/${taskId}/video`;
      $("preview").load();
      $("doneLink").style.display = "block";
      renderStats(ev);
      es.close(); refreshList(); busy = false; $("go").disabled = false; return;
    }
    if (ev.stage === "error") { fail(ev.message || "生成失败"); es.close(); refreshList(); return; }
    const pos = idx[ev.stage];
    const pct = pos === undefined ? 10 : Math.max(5, Math.round(pos / (order.length - 1) * 95));
    let extra = STAGE_LABEL[ev.stage] || ev.stage || "…";
    if (ev.total_elapsed_s != null) {
      const phase = (ev.phase_duration_s != null && ev.phase_duration_s > 0)
        ? ` · 上一步 ${(ev.phase_duration_s).toFixed(1)}s` : "";
      extra += `${phase} · 总耗时 ${ev.total_elapsed_s.toFixed(1)}s`;
    }
    showProgress(ev.stage, pct, extra);
  };
  es.onerror = () => {};
}

function stageLabel(s) { return STAGE_LABEL[s] || s; }

function renderStats(ev) {
  const box = $("statsBox");
  const st = ev.stage_timings || {};
  const rows = Object.entries(st).map(([k, v]) =>
    `<tr><td>${stageLabel(k)}</td><td>${Number(v).toFixed(1)} s</td></tr>`).join("");
  let html = `<table class="stats-table"><thead><tr><th>阶段</th><th>耗时</th></tr></thead><tbody>${rows}`;
  if (ev.total_elapsed_s != null) {
    html += `<tr class="total"><td>总耗时</td><td>${ev.total_elapsed_s.toFixed(1)} s</td></tr>`;
  }
  html += "</tbody></table>";
  const u = ev.llm_usage;
  if (u && u.total_tokens != null) {
    html += `<div class="tok">LLM 用量（${escapeHtml(u.model || "-")}）：` +
      `prompt ${u.prompt_tokens} · completion ${u.completion_tokens} · total ${u.total_tokens} tokens</div>`;
  }
  box.innerHTML = html;
  box.style.display = "block";
}

async function refreshList() {
  const res = await fetch("/api/tasks");
  const tasks = await res.json();
  const list = $("list"); list.innerHTML = "";
  if (!tasks.length) { list.innerHTML = '<div class="sub">暂无历史任务</div>'; return; }
  for (const t of tasks) {
    const item = document.createElement("div"); item.className = "item";
    const dl = t.status === "done" ? `<a class="dl" href="/api/tasks/${t.id}/video" target="_blank">预览/下载</a>` : "";
    item.innerHTML =
      `<div class="sum">${escapeHtml(t.summary)}</div>` +
      `<span class="badge ${t.status}">${t.status}</span>` +
      `<span class="time">${fmtTime(t.created_at)}</span>${dl}`;
    list.appendChild(item);
  }
}
function escapeHtml(s) { return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtTime(ts) { const d = new Date(ts * 1000); return d.toLocaleString("zh-CN", {month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}); }

boot();
</script>
</body>
</html>
